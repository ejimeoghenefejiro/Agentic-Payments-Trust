services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - agenttrust_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.15.4
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - agenttrust_qdrantdata:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/6333'"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: agenttrust
      POSTGRES_USER: agenttrust
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "5432:5432"
    volumes:
      - agenttrust_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agenttrust"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "8080:8080"
    environment:
      POSTGRES_CONNECTION: "Host=postgres;Port=5432;Database=agenttrust;Username=agenttrust;Password=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}"
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      ConsumerMemory__Enabled: "true"
      ConsumerMemory__Qdrant__Url: "http://qdrant:6333"
      ConsumerMemory__Redis__ConnectionString: "redis:6379,abortConnect=false"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy

  runner:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
    # The runner is a one-shot scenario suite, not a long-running service — run it on demand:
    #   docker compose run --rm runner
    #   docker compose run --rm runner --demo
    #   docker compose run --rm runner --cross-model
    profiles: ["tools"]

volumes:
  agenttrust_pgdata:
  agenttrust_redisdata:
  agenttrust_qdrantdata:
